name: Update market data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 06:00 Asia/Taipei = previous day 22:00 UTC.
    # GitHub schedules may start a little late.
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh public market data
        run: |
          for attempt in 1 2 3; do
            if python server.py --refresh-only; then
              exit 0
            fi
            echo "Refresh attempt ${attempt} failed."
            sleep $((attempt * 10))
          done
          exit 1
      - name: Save refreshed snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_market_data.json snapshots/
          git diff --cached --quiet || git commit -m "data: refresh pre-open snapshot"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
